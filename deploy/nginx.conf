# Reverse proxy of a blue-green CivicSense environment. The upstream "civic_web"
# is defined in live.conf, next to this file, and names the live slot
# (web-blue or web-green). ci/deploy.sh rewrites live.conf and reloads nginx;
# a reload lets the old worker processes finish their requests, so no request
# is dropped during the switch.

server {
    listen 80;
    server_name _;
    client_max_body_size 12M;          # complaint photographs

    location /static/ { alias /app/staticfiles/; expires 30d; access_log off; }
    location /media/  { alias /app/media/;      expires 7d; }

    location / {
        proxy_pass http://civic_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
