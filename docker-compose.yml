# One command brings up the whole platform:  docker compose up --build
#
#   db    - MySQL 8, the production database of the project
#   web   - Django served by gunicorn
#   nginx - serves /static and /media and proxies everything else to web
# A fixed project name keeps the volume names (civicsense_mysql_data, ...) the same on
# every machine, so the swarm stack "civicsense" finds and re-uses the same data.
name: civicsense

services:
  db:
    image: mysql:8.4   # 8.4 LTS: required by Django 6.x
    container_name: civic-db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: civicsense
      MYSQL_USER: civic
      MYSQL_PASSWORD: civic
      MYSQL_ROOT_PASSWORD: rootpass
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-prootpass"]
      interval: 10s
      timeout: 5s
      retries: 10
    ports:
      - "3307:3306"        # host port 3307 keeps a local MySQL untouched

  web:
    build: .
    container_name: civic-web
    restart: unless-stopped
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-compose-dev-key}
      DJANGO_DEBUG: "0"
      DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1,web,nginx
      # nginx passes the Host header without the port, so the published port has
      # to be listed here or every login is rejected by Django's CSRF origin check.
      DJANGO_CSRF_TRUSTED_ORIGINS: http://localhost:8080,http://127.0.0.1:8080
      DB_ENGINE: mysql
      DB_NAME: civicsense
      DB_USER: civic
      DB_PASSWORD: civic
      DB_HOST: db
      DB_PORT: "3306"
      # Demo data is loaded once with:
      #   docker compose exec web python manage.py seed_demo --reset
      # Seeding on every start would add the demo complaints again after each restart.
      SEED_DEMO_DATA: "0"
    volumes:
      - static_files:/app/staticfiles
      - media_files:/app/media
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8000"

  nginx:
    image: nginx:1.27-alpine
    container_name: civic-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - static_files:/app/staticfiles:ro
      - media_files:/app/media:ro
    depends_on:
      - web

volumes:
  mysql_data:
  static_files:
  media_files:
