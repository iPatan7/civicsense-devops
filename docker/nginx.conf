upstream civic_web {
    server web:8000;
}

server {
    listen 80;
    server_name _;
    client_max_body_size 12M;          # complaint photographs

    # Static files and citizen uploads are served by nginx, never by Django.
    location /static/ { alias /app/staticfiles/; expires 30d; access_log off; }
    location /media/  { alias /app/media/;      expires 7d; }

    location /healthz {
        proxy_pass http://civic_web;
        proxy_set_header Host $host;          # without this Django sees the
        proxy_set_header X-Real-IP $remote_addr;   # upstream name as the host
        access_log off;
    }

    location / {
        proxy_pass http://civic_web;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }
}
