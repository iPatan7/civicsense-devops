{% extends "base.html" %}
{% block title %}Track a complaint{% endblock %}
{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card">
      <div class="card-body">
        <h1 class="h5">Track a complaint</h1>
        <p class="text-muted small">Enter the tracking id you received when the
          complaint was registered.</p>
        <form method="get" class="d-flex gap-2">
          {{ form.tracking_id }}
          <button class="btn btn-primary">Track</button>
        </form>
        {% for error in form.tracking_id.errors %}<div class="text-danger small mt-2">{{ error }}</div>{% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
